name: ORION historical research

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start, e.g. 2024-01-01T00:00:00Z"
        required: true
        default: "2024-01-01T00:00:00Z"
      end:
        description: "UTC end, e.g. 2026-01-01T00:00:00Z"
        required: true
        default: "2026-01-01T00:00:00Z"
      simulations:
        description: "Monte Carlo simulations"
        required: true
        default: "10000"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,dukascopy]"
      - name: Run ORION research
        env:
          ORION_DATA_PROVIDER: dukascopy
        run: |
          python scripts/run_research.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --simulations "${{ inputs.simulations }}" \
            --output reports/validation
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: orion-validation-${{ github.run_id }}
          path: reports/validation/
          if-no-files-found: error